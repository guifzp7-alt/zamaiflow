<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><style>
html,body{margin:0;background:#0B0D0F;color:#F4F6F5;font-family:Sora,Arial,sans-serif}canvas{display:block;width:1280px;height:720px}pre{display:none}
</style></head>
<body><canvas id="scene" width="1280" height="720"></canvas><pre id="payload"></pre>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),out=document.querySelector('#payload');
const W=canvas.width,H=canvas.height,DURATION=13;
const ease=t=>{t=Math.max(0,Math.min(1,t));return 1-Math.pow(1-t,3)};
function rr(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function txt(s,x,y,size,color='#F4F6F5',weight=500,align='left'){ctx.font=`${weight} ${size}px Sora,Arial,sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,color='rgba(244,246,245,.1)',lw=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke()}
function logo(x,y,size){rr(x,y,size,size,Math.round(size*.23),'#28D7E8');ctx.save();ctx.translate(x,y);ctx.scale(size/100,size/100);ctx.beginPath();ctx.moveTo(23,28);ctx.lineTo(76,28);ctx.lineTo(28,63);ctx.lineTo(51,63);ctx.strokeStyle='#F4F6F5';ctx.lineWidth=13;ctx.lineCap='square';ctx.lineJoin='round';ctx.stroke();ctx.beginPath();ctx.moveTo(52,51);ctx.lineTo(80,68);ctx.lineTo(52,85);ctx.closePath();ctx.fillStyle='#F4F6F5';ctx.fill();ctx.restore()}
function bg(){ctx.fillStyle='#0B0D0F';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(40,215,232,.055)';ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function scene(t){bg();
  if(t<2.8){let p=ease((t-.15)/.65);logo(136,140,50);txt('ZAMAI',204,165,20,'#F4F6F5',700);txt('FLOW',279,165,20,'#28D7E8',700);txt('UMA NOVA FORMA DE ORGANIZAR SEUS REELS',140,260,12,'#8A9298',600);ctx.save();ctx.globalAlpha=p;txt('Seu conteúdo.',140,342,59,'#F4F6F5',600);txt('Seu ritmo.',140,414,59,'#F4F6F5',600);txt('Seu Flow.',140,486,59,'#28D7E8',600);ctx.restore();rr(143,565,211,48,8,'#28D7E8');txt('ORGANIZE SEU PRÓXIMO REEL',248,589,11,'#0B0D0F',700,'center');rr(818,166,300,382,12,'#131719','rgba(244,246,245,.15)');rr(850,202,236,130,9,'#1A2022','rgba(244,246,245,.07)');txt('SUA ROTINA DE CONTEÚDO',870,226,9,'#8A9298',600);txt('Mais leve.',870,263,24,'#F4F6F5',600);txt('Mais clara.',870,295,24,'#28D7E8',600);rr(850,350,105,76,8,'#171D1F','rgba(244,246,245,.07)');rr(967,350,119,76,8,'#171D1F','rgba(40,215,232,.2)');txt('NA FILA',867,370,8,'#8A9298',500);txt('08',867,399,22,'#F4F6F5',600);txt('PRÓXIMO REEL',984,370,8,'#8A9298',500);txt('18:30',984,399,22,'#28D7E8',600);txt('MENOS CORRERIA. MAIS FLOW.',970,481,9,'#8A9298',600,'center');}
  else if(t<9.7){let q=ease((t-2.8)/.7);rr(92,54+40*(1-q),1096,612,13,'#111517','rgba(244,246,245,.14)');rr(92,54+40*(1-q),1096,51,13,'#14191B');line(92,105+40*(1-q),1188,105+40*(1-q));logo(118,69+40*(1-q),22);txt('ZAMAI',151,80+40*(1-q),11,'#F4F6F5',700);txt('FLOW',204,80+40*(1-q),11,'#28D7E8',700);txt('VISÃO GERAL',1132,80+40*(1-q),8,'#8A9298',600,'right');txt('SEU ESPAÇO DE CONTEÚDO',139,146+40*(1-q),9,'#8A9298',600);txt('Seu Flow está em movimento.',139,178+40*(1-q),24,'#F4F6F5',600);rr(139,216+40*(1-q),292,92,8,'#171D1F','rgba(244,246,245,.08)');rr(448,216+40*(1-q),292,92,8,'#171D1F','rgba(40,215,232,.22)');txt('NA SUA FILA',160,240+40*(1-q),9,'#8A9298',500);txt('08',160,278+40*(1-q),29,'#F4F6F5',600);txt('vídeos organizados',200,278+40*(1-q),9,'#8A9298',400);txt('PRÓXIMA PUBLICAÇÃO',470,240+40*(1-q),9,'#8A9298',500);txt('18:30',470,278+40*(1-q),29,'#28D7E8',600);txt('hoje · agendado',548,278+40*(1-q),9,'#8A9298',400);txt('PRÓXIMOS REELS',139,352+40*(1-q),9,'#8A9298',600);txt('VER FILA  ↗',1140,352+40*(1-q),8,'#28D7E8',600,'right');
    const rows=[['Ideias que viram conteúdo','Hoje · 18:30','Agendado'],['Bastidores da criação','Amanhã · 09:00','Na fila'],['Uma dica para salvar','Sexta · 17:30','Na fila']];rows.forEach((r,i)=>{let start=380+i*70+40*(1-q),alpha=ease((t-(3.45+i*.38))/.45);ctx.save();ctx.globalAlpha=alpha;rr(139,start,1000,59,7,'#14191B','rgba(244,246,245,.07)');rr(154,start+10,32,39,5,['#17616A','#465255','#263538'][i]);txt('▶',170,start+30,8,'#F4F6F5',600,'center');txt(r[0],202,start+22,10,'#F4F6F5',500);txt(r[1],202,start+41,8,'#8A9298',400);rr(1019,start+18,92,23,12,'rgba(40,215,232,.1)');txt(r[2],1065,start+30,7,'#A4E8ED',500,'center');ctx.restore()});
    rr(139,608+40*(1-q),1000,31,6,'#102427','rgba(40,215,232,.16)');txt('ORGANIZE SEUS VÍDEOS',158,624+40*(1-q),8,'#28D7E8',600);txt('Escolha o horário e acompanhe sua fila.',1120,624+40*(1-q),8,'#AAB4B7',400,'right');
  } else {let p=ease((t-9.7)/.7);logo(588,160,84);ctx.save();ctx.globalAlpha=p;txt('ZAMAI',640,315,40,'#F4F6F5',700,'center');txt('FLOW',744,315,40,'#28D7E8',700,'left');txt('Seu conteúdo. Seu ritmo. Seu Flow.',640,374,19,'#F4F6F5',400,'center');rr(505,438,270,1,1,'rgba(40,215,232,.55)');txt('ORGANIZE · PROGRAME · SIGA O SEU RITMO',640,475,9,'#8A9298',600,'center');ctx.restore();}
}
async function start(){const stream=canvas.captureStream(30);let rec;try{rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:3200000})}catch{rec=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:3200000})}const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{const buf=new Uint8Array(await new Blob(chunks,{type:rec.mimeType}).arrayBuffer());let s='';for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode(...buf.subarray(i,Math.min(i+0x8000,buf.length)));out.textContent=btoa(s);document.documentElement.dataset.done='yes'};const begin=performance.now();const draw=now=>{const t=(now-begin)/1000;scene(t);if(t<DURATION)requestAnimationFrame(draw);else{scene(DURATION);setTimeout(()=>rec.stop(),350)}};rec.start(1000);requestAnimationFrame(draw)}
start();
</script></body></html>
